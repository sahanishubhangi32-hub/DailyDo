<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DailyDo | Task Manager</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #f5efe6;
    color: #49382c;
}

.container {
    max-width: 520px;
    margin: 20px auto;
    padding: 24px;
    background: #fffdf9;
    border-radius: 22px;
    box-shadow: 0 5px 20px #d9cabb;
}

h1 {
    text-align: center;
    color: #76563f;
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    color: #998575;
    margin-bottom: 25px;
}

.greeting {
    background: #f1e5d7;
    padding: 15px;
    border-radius: 14px;
    margin-bottom: 20px;
}

.greeting h3 {
    margin: 0 0 5px;
}

.greeting p {
    margin: 0;
    font-size: 14px;
}

.task-form {
    display: grid;
    gap: 10px;
}

input {
    width: 100%;
    padding: 12px;
    border: 1px solid #d8c5b3;
    border-radius: 10px;
    font-size: 15px;
    background: white;
    color: #49382c;
}

button {
    padding: 11px 14px;
    border: none;
    border-radius: 10px;
    background: #87664d;
    color: white;
    cursor: pointer;
    font-size: 14px;
}

button:active {
    opacity: 0.75;
}

#saveBtn {
    width: 100%;
}

.stats {
    margin: 20px 0 12px;
    padding: 15px;
    background: #f1e5d7;
    border-radius: 12px;
    text-align: center;
    font-weight: bold;
}

.progress-bg {
    height: 10px;
    background: #e8dbcd;
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 22px;
}

#progressBar {
    height: 100%;
    width: 0%;
    background: #87664d;
    border-radius: 20px;
    transition: width 0.3s;
}

.filters {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 7px;
    margin-bottom: 18px;
}

.filters button {
    background: #e8dbcd;
    color: #49382c;
}

.filters button.active {
    background: #87664d;
    color: white;
}

ul {
    list-style: none;
    padding: 0;
    margin: 0;
}

li {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 10px;
    padding: 12px;
    background: #f8f2ea;
    border-radius: 12px;
}

.check {
    width: 19px;
    height: 19px;
    flex-shrink: 0;
}

.task-info {
    flex: 1;
    min-width: 0;
    overflow-wrap: anywhere;
}

.task-text {
    display: block;
    font-size: 15px;
}

.task-date {
    display: block;
    font-size: 12px;
    color: #998575;
    margin-top: 5px;
}

li.completed .task-text {
    text-decoration: line-through;
    color: #a39487;
}

.actions {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.edit {
    background: #a58a70;
    padding: 7px 9px;
}

.delete {
    background: #a65c4d;
    padding: 7px 9px;
}

#empty {
    text-align: center;
    color: #a39487;
    padding: 18px 5px;
}

footer {
    text-align: center;
    margin-top: 25px;
    font-size: 12px;
    color: #a39487;
}
</style>
</head>

<body>

<div class="container">

    <h1>🌿 DailyDo</h1>
    <p class="subtitle">Your day, your goals, your progress.</p>

    <div class="greeting">
        <h3 id="greeting">Hello! 👋</h3>
        <p>Small steps every day lead to big results.</p>
    </div>

    <h3 id="formTitle">Add a New Task</h3>

    <div class="task-form">
        <input id="taskInput" type="text"
               placeholder="What do you need to do?">

        <label for="taskDate">Due date (optional)</label>
        <input id="taskDate" type="date">

        <button id="saveBtn" onclick="saveTask()">+ Add Task</button>
        <button id="cancelBtn" onclick="cancelEdit()"
                style="display:none;background:#a39487">
            Cancel Edit
        </button>
    </div>

    <div class="stats" id="stats">
        0 of 0 tasks completed
    </div>

    <div class="progress-bg">
        <div id="progressBar"></div>
    </div>

    <div class="filters">
        <button class="active" onclick="setFilter('all', this)">All</button>
        <button onclick="setFilter('pending', this)">Pending</button>
        <button onclick="setFilter('completed', this)">Completed</button>
    </div>

    <ul id="taskList"></ul>
    <p id="empty">Your list is empty. Add your first task! ✨</p>

    <footer>Made with care ♡ | DailyDo</footer>

</div>

<script>
let tasks = [];

try {
    tasks = JSON.parse(localStorage.getItem("dailyDoTasks")) || [];
    if (!Array.isArray(tasks)) tasks = [];
} catch (error) {
    tasks = [];
}

let currentFilter = "all";
let editingId = null;

function loadGreeting() {
    const hour = new Date().getHours();
    let message = "Good evening! 🌙";

    if (hour < 12) message = "Good morning! ☀️";
    else if (hour < 17) message = "Good afternoon! 🌼";

    document.getElementById("greeting").textContent = message;
}

function saveTasksToStorage() {
    try {
        localStorage.setItem("dailyDoTasks", JSON.stringify(tasks));
    } catch (error) {
        alert("Tasks could not be saved in this browser.");
    }
}

function saveTask() {
    const input = document.getElementById("taskInput");
    const dateInput = document.getElementById("taskDate");
    const text = input.value.trim();
    const date = dateInput.value;

    if (text === "") {
        alert("Please enter a task first!");
        input.focus();
        return;
    }

    if (editingId !== null) {
        tasks = tasks.map(task => {
            if (task.id === editingId) {
                return {...task, text: text, date: date};
            }
            return task;
        });
    } else {
        tasks.push({
            id: Date.now(),
            text: text,
            date: date,
            completed: false
        });
    }

    cancelEdit();
    saveTasksToStorage();
    renderTasks();
}

function editTask(id) {
    const task = tasks.find(task => task.id === id);
    if (!task) return;

    editingId = id;
    document.getElementById("taskInput").value = task.text;
    document.getElementById("taskDate").value = task.date || "";
    document.getElementById("formTitle").textContent = "Edit Your Task";
    document.getElementById("saveBtn").textContent = "Save Changes";
    document.getElementById("cancelBtn").style.display = "block";

    document.getElementById("taskInput").focus();
    window.scrollTo({top: 0, behavior: "smooth"});
}

function cancelEdit() {
    editingId = null;
    document.getElementById("taskInput").value = "";
    document.getElementById("taskDate").value = "";
    document.getElementById("formTitle").textContent = "Add a New Task";
    document.getElementById("saveBtn").textContent = "+ Add Task";
    document.getElementById("cancelBtn").style.display = "none";
}

function toggleTask(id) {
    tasks = tasks.map(task => {
        if (task.id === id) {
            return {...task, completed: !task.completed};
        }
        return task;
    });

    saveTasksToStorage();
    renderTasks();
}

function deleteTask(id) {
    if (!confirm("Are you sure you want to delete this task?")) {
        return;
    }

    tasks = tasks.filter(task => task.id !== id);

    if (editingId === id) cancelEdit();

    saveTasksToStorage();
    renderTasks();
}

function setFilter(filter, button) {
    currentFilter = filter;

    document.querySelectorAll(".filters button")
        .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");
    renderTasks();
}

function renderTasks() {
    const list = document.getElementById("taskList");
    const empty = document.getElementById("empty");

    list.replaceChildren();

    const filteredTasks = tasks.filter(task => {
        if (currentFilter === "pending") return !task.completed;
        if (currentFilter === "completed") return task.completed;
        return true;
    });

    filteredTasks.forEach(task => {
        const item = document.createElement("li");

        if (task.completed) item.classList.add("completed");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.className = "check";
        checkbox.checked = task.completed;
        checkbox.setAttribute("aria-label", "Complete task");
        checkbox.addEventListener("change", () => toggleTask(task.id));

        const info = document.createElement("div");
        info.className = "task-info";

        const text = document.createElement("span");
        text.className = "task-text";
        text.textContent = task.text;
        info.appendChild(text);

        if (task.date) {
            const date = document.createElement("span");
            date.className = "task-date";
            date.textContent = "Due: " + task.date;
            info.appendChild(date);
        }

        const actions = document.createElement("div");
        actions.className = "actions";

        const edit = document.createElement("button");
        edit.className = "edit";
        edit.textContent = "Edit";
        edit.addEventListener("click", () => editTask(task.id));

        const del = document.createElement("button");
        del.className = "delete";
        del.textContent = "Delete";
        del.addEventListener("click", () => deleteTask(task.id));

        actions.append(edit, del);
        item.append(checkbox, info, actions);
        list.appendChild(item);
    });

    empty.style.display = filteredTasks.length === 0 ? "block" : "none";

    const completed = tasks.filter(task => task.completed).length;
    const total = tasks.length;
    const percentage = total === 0 ? 0 : Math.round(completed / total * 100);

    document.getElementById("stats").textContent =
        `${completed} of ${total} tasks completed (${percentage}%)`;

    document.getElementById("progressBar").style.width = percentage + "%";
}

document.getElementById("taskInput").addEventListener("keydown", event => {
    if (event.key === "Enter") saveTask();
});

loadGreeting();
renderTasks();
</script>

</body>
</html>
